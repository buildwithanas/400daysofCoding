<form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">username:</label>
        <input type="text" id="username" placeholder="Enter your name" minlength="6" maxlength="15" required><br>

        <label for="passwords">passwords:</label>
        <input type="password" id="passwords" minlength="6" maxlength="15" required><br> 

        <label for="email">email:</label>
        <input type="email" id="email" placeholder="@gmail.com" minlength="6" maxlength="15" required><br> 

        <label for="phone number">phone #:</label>
        <input type="tel" id="phone number" minlength="6" maxlength="15" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

        <label for="bday">birthdate:</label>
        <input type="date" id="bday" minlength="6" maxlength="15" required><br> 

        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" minlength="0" maxlength="99" value="1" required><br> 

        <label for="title">title:</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Mrs.">Mrs.</label>
        <input type="radio" id="Mrs." value="Mrs." name="title">
        <label for="PHD.">PHD.</label>
        <input type="radio" id="PHD" value="PHD" name="title"><br>

        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select><br>

        <label for="subscribe:">subscribe:</label>
        <input type="checkbox" id="subscribe:"><br>
   
        <label for="comment:">comment:</label>
        <textarea id="comment" rows:"3" cols="25"></textarea><br>

        <label for="file:">file:</label>
        <input type="file" id="file" accept="image/png, image/jpg"><br>


        <input type="reset"><br>
        <input type="submit">

    </form>
